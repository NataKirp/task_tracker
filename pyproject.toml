[project]
name = "task-tracker"
version = "0.1.0"
description = "REST API для трекера задач сотрудников с аналитикой загрузки и управлением зависимостями"
authors = [
    {name = "Natalia Kirpichnikova",email = "kirpichnikova.nb@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=5.2.8)",
    "djangorestframework (>=3.16,<4.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-cors-headers (>=4.8.0,<5.0.0)",
    "celery (>=5.6.0,<6.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "redis (>=5.0,<6.5)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "requests[socks] (>=2.34.2,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "coverage (>=7.16.2,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "flake8 (>=7.4.1,<8.0.0)"
]

[black]
line-length = 119
exclude = '\.git'

[isort]
line_length = 119
force_single_line = true

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/__init__.py",
    "*/apps.py",
    "*/admin.py",
    "*/tests.py",
    "manage.py",
    "config/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
